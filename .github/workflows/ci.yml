name: Publish Docker image Prod

on:
  push:
    branches: 
      - master

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
    env:
      API_IMAGE_REPOSITORY: wfelipe2011/territorio-digital-prod
      WORKER_IMAGE_REPOSITORY: wfelipe2011/territorio-digital-field-worker-prod
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Test image pair recording
        run: python3 .github/scripts/test_image_pair.py

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.API_IMAGE_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ github.sha }}

      - name: Extract worker metadata
        id: worker_meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.WORKER_IMAGE_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Bun field worker
        id: worker_push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile.field
          push: true
          tags: ${{ steps.worker_meta.outputs.tags }}
          labels: ${{ steps.worker_meta.outputs.labels }}

      - name: Record API and worker release digests
        env:
          IMAGE_PAIR_DIR: ${{ runner.temp }}/territory-image-pair
          API_DIGEST: ${{ steps.push.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker_push.outputs.digest }}
        run: python3 .github/scripts/write-image-pair.py

      - name: Upload immutable image pair
        uses: actions/upload-artifact@v4
        with:
          name: territory-image-pair-prod-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/territory-image-pair/
          if-no-files-found: error
