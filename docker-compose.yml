version: '3.8'
# Production Swarm stack. Wait for BOTH image publications before redeploying.
# Image repositories/tags are defined here; no image environment variables needed.
# No host ports: the existing NPM keeps app-prod:3000 as its default upstream
# and routes only field sync/session to Bun. See deploy/npm-field-locations.conf.

services:
  pgbouncer:
    # Preserve the currently running PgBouncer release.
    image: edoburu/pgbouncer@sha256:9c78945868a6a142c7fc40ccd843bbe5a606df163c7ffce4de70e0d628d696a2
    environment:
      - DB_HOST=$POSTGRES_HOST
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_USER=$POSTGRES_USER
      - DB_PASSWORD=$POSTGRES_PASSWORD
      - DB_NAME=$POSTGRES_DB
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=80
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
      - AUTH_TYPE=scram-sha-256
    networks:
      - npm_public

  app-prod:
    image: wfelipe2011/territorio-digital-prod:master
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.4'
          memory: 2G
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first
    environment:
      # MCP/OAuth: disabled until API/Admin origins and persistent secrets are provisioned.
      - AGENT_MCP_ENABLED=${AGENT_MCP_ENABLED:-false}
      - AGENT_MCP_ALLOWED_TENANT_IDS=${AGENT_MCP_ALLOWED_TENANT_IDS:-}
      - AGENT_PUBLIC_ORIGIN=${AGENT_PUBLIC_ORIGIN:-}
      - AGENT_ADMIN_PUBLIC_ORIGIN=${AGENT_ADMIN_PUBLIC_ORIGIN:-}
      - AGENT_OAUTH_ENCRYPTION_KEY=${AGENT_OAUTH_ENCRYPTION_KEY:-}
      - AGENT_OAUTH_COOKIE_KEYS=${AGENT_OAUTH_COOKIE_KEYS:-}
      - AGENT_OAUTH_JWKS=${AGENT_OAUTH_JWKS:-}
      - AGENT_OAUTH_CLIENTS=${AGENT_OAUTH_CLIENTS:-}
      - AGENT_OAUTH_CIMD_ORIGINS=${AGENT_OAUTH_CIMD_ORIGINS:-https://chatgpt.com,https://claude.ai}
      - PORT=3000
      # DATABASE_URL aponta para PgBouncer (transaction pooling)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?pgbouncer=true&connection_limit=10
      # DIRECT_URL aponta direto ao Postgres — usado pelo Prisma para migrations
      - DIRECT_URL=${DIRECT_URL:?Set direct PostgreSQL URL}
      - JWT_SECRET=$JWT_SECRET
      - API_KEY_SECRET=${API_KEY_SECRET:?Set the shared API key secret}
      - FIELD_POLL_CHECK_MS=1000
      - FIELD_WORKER_INTERNAL_URL=http://field-worker:3402
      - TZ=$TZ
      - LOGTAIL_API_KEY=$LOGTAIL_API_KEY
      - POSTGRES_DB=$POSTGRES_DB
      - NODEMAILER_USER=$NODEMAILER_USER
      - NODEMAILER_APP_PASS=$NODEMAILER_APP_PASS
      - SUPER_ADMIN_ID=$SUPER_ADMIN_ID
      - AWS_REGION=$AWS_REGION
      - AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
      - CLOUDWATCH_LOG_GROUP=$CLOUDWATCH_LOG_GROUP
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - npm_public

  field-worker:
    image: wfelipe2011/territorio-digital-field-worker-prod:master
    stop_grace_period: 40s
    ulimits:
      nofile: { soft: 32768, hard: 32768 }
    environment:
      - PORT=3402
      - TZ=${TZ:-America/Sao_Paulo}
      # Direct PostgreSQL only: this connection also carries LISTEN/NOTIFY.
      - DATABASE_URL=${FIELD_DATABASE_URL:?Set direct PostgreSQL worker URL, not transaction pooling}
      - JWT_SECRET=${JWT_SECRET:?Set the shared JWT secret}
      - API_KEY_SECRET=${API_KEY_SECRET:?Set the shared API key secret}
      - FIELD_DB_POOL_SIZE=2
      - FIELD_POLL_CHECK_MS=1000
      - FIELD_READ_MODEL_ENABLED=1
    healthcheck:
      test: ["CMD", "bun", "-e", "if (!(await fetch('http://localhost:3402/healthz')).ok) process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.7'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 45s
    networks: [npm_public]

networks:
  npm_public:
    external: true
