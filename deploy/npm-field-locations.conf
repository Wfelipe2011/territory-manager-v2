# NPM > existing API Proxy Host > Advanced > Custom Nginx Configuration.
# Keep Details upstream http://app-prod:3000 and existing SSL/access settings.
# Apply ONLY after api-production_field-worker is healthy on npm_public.
# Regex is bounded: marking, signature entry and other API paths stay in NestJS.
location ~ ^/(healthz|v1/field/(blocks/[^/]+/sync/?|sync/?|session/?))$ {
    # Docker embedded DNS + variable upstream recover from Swarm task/VIP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $territory_field_worker api-production_field-worker:3402;
    proxy_pass http://$territory_field_worker$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    add_header X-Territory-Upstream field-worker always;
}
