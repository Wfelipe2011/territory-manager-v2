worker_processes 1;
events { worker_connections 8192; }
http {
  access_log off;
  upstream field_api { server api1:3000; server api2:3000; keepalive 128; }
  server {
    listen 8080;
    location / {
      proxy_pass http://field_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
      add_header X-Load-Upstream $upstream_addr always;
    }
  }
}
