name: territory-load
x-api: &api
  image: territory-load-api:${LOAD_VARIANT:-baseline}
  build:
    context: ..
    dockerfile: Dockerfile.production
  cpus: 1.0
  mem_limit: 512m
  environment: &api-env
    NODE_ENV: production
    NODE_OPTIONS: --max-old-space-size=384
    PORT: 3000
    DATABASE_URL: postgresql://load:load-local-only@db:5432/${LOAD_DATABASE:-territory_manager_load}?connection_limit=10&pool_timeout=20
    DIRECT_URL: postgresql://load:load-local-only@db:5432/${LOAD_DATABASE:-territory_manager_load}
    JWT_SECRET: load-test-isolated-secret
    API_KEY_SECRET: load-test-only
    NODEMAILER_USER: ""
    NODEMAILER_APP_PASS: ""
    LOGTAIL_API_KEY: ""
    LOG_LEVEL: warn
    FIELD_PERF_DIAGNOSTICS: ${FIELD_PERF_DIAGNOSTICS:-0}
    FIELD_POLL_CHECK_MS: ${FIELD_POLL_CHECK_MS:-3000}
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - ./:/load:ro
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "2"}
services:
  db:
    image: postgres:16-alpine
    cpus: 1.0
    mem_limit: 1g
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, shared_buffers=256MB, -c, max_connections=100]
    environment:
      POSTGRES_USER: load
      POSTGRES_PASSWORD: load-local-only
      POSTGRES_DB: territory_manager_load
    healthcheck:
      test: [CMD-SHELL, pg_isready -U load -d territory_manager_load]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - load-db:/var/lib/postgresql/data
  api1:
    <<: *api
  api2:
    <<: *api
  admin:
    image: territory-load-admin:${LOAD_ADMIN_VARIANT:-baseline}
    build:
      context: ../../admin-territory-manager
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3301
        NEXT_PUBLIC_APP_URL: http://localhost:5800
    cpus: 0.5
    mem_limit: 512m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      NEXT_TELEMETRY_DISABLED: 1
    ports: ["127.0.0.1:5800:4800"]
  proxy:
    image: nginx:1.28-alpine
    cpus: 0.25
    mem_limit: 128m
    ports: ["127.0.0.1:3301:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api1, api2]
  k6:
    image: grafana/k6:1.3.0
    profiles: [tools]
    cpus: 1.0
    mem_limit: 1g
    environment:
      GOMAXPROCS: 1
    volumes:
      - ./:/load:ro
      - ./.runtime:/output
    working_dir: /load
volumes:
  load-db:
