# Opt-in overlay: docker-compose.yml + this file. Does NOT deploy by itself.
# Prepare API/Admin cutover and external PostgreSQL quota before routing traffic.
# See deploy/README.md. Intended for Docker Compose v2, not docker stack deploy.
services:
  app-prod:
    image: ${API_IMAGE:?Set API_IMAGE to the validated API release digest}
    cpus: 0.4
    deploy:
      resources:
        limits:
          cpus: '0.4'
    environment:
      PORT: '3000'
      DIRECT_URL: ${DIRECT_URL:?Set DIRECT_URL to the direct PostgreSQL URL for migrations}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set the same API_KEY_SECRET for API and worker}
      FIELD_POLL_CHECK_MS: '1000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  field-worker:
    image: ${FIELD_WORKER_IMAGE:?Set FIELD_WORKER_IMAGE to the worker digest built from the same API revision}
    restart: unless-stopped
    init: true
    cpus: 0.7
    mem_limit: 2g
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.7'
          memory: 2G
    stop_grace_period: 40s
    ulimits:
      nofile: { soft: 32768, hard: 32768 }
    environment:
      PORT: '3402'
      TZ: ${TZ:-America/Sao_Paulo}
      # Direct PostgreSQL/session pooling only: the listener uses this URL too.
      DATABASE_URL: ${FIELD_DATABASE_URL:?Set FIELD_DATABASE_URL to direct PostgreSQL, never transaction pooling}
      JWT_SECRET: ${JWT_SECRET:?Set the same JWT_SECRET for API and worker}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set the same API_KEY_SECRET for API and worker}
      FIELD_DB_POOL_SIZE: '2'
      FIELD_POLL_CHECK_MS: '1000'
      FIELD_READ_MODEL_ENABLED: '1'
    expose: ['3402']
    depends_on:
      app-prod: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'bun', '-e', "if (!(await fetch('http://localhost:3402/healthz')).ok) process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [npm_public]

  field-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    cpus: 0.1
    mem_limit: 128m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    environment:
      FIELD_SYNC_UPSTREAM: ${FIELD_SYNC_UPSTREAM:-field-worker:3402}
      NGINX_ENVSUBST_FILTER: FIELD_SYNC_UPSTREAM
    expose: ['8080']
    volumes:
      - ./deploy/nginx-api.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      app-prod: { condition: service_healthy }
      field-worker: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      npm_public:
        aliases: [territory-api-proxy]
